<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#006AFE"/>
      <stop offset="100%" stop-color="#006AFE"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Concentric rings, preserving the source geometry -->
  <circle cx="256" cy="256" r="130" fill="none" stroke="#B4D3FE" stroke-width="4"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#70ACFE" stroke-width="2"/>
  <!-- Sun circle -->
  <circle cx="256" cy="256" r="96" fill="#FFFFFF"/>
  <!-- Subtle inner highlight -->
  <circle cx="240" cy="236" r="60" fill="#EDF3FD"/>
</svg>
