---
name: Sunclub setup
description: Locked repository tooling with optional Xcode and Tuist preparation
inputs:
  xcode:
    description: Prepare Xcode and the authenticated Tuist cache
    default: "false"
runs:
  using: composite
  steps:
    - name: Configure repository environment
      shell: bash
      run:
        | # zizmor: ignore[github-env] fixed variable allowlist with newline rejection
        source scripts/tooling/common.sh
        setup_local_tooling_env
        for name in MISE_CONFIG_DIR MISE_TRUSTED_CONFIG_PATHS MISE_YES MISE_LOCKED UV_FROZEN UV_CACHE_DIR UV_PROJECT_ENVIRONMENT HK_CACHE_DIR HK_STATE_DIR npm_config_cache; do
          value="${!name}"
          [[ "$value" != *$'\n'* && "$value" != *$'\r'* ]] || exit 1
          printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
        done
    - name: Install locked tools
      uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      with:
        version: "2026.10.20"
        install_args: --locked
        cache: true
    - name: Restore repository caches
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .cache/uv
          .cache/npm
          .cache/hk
          .cache/swiftlint
        key: ${{ runner.os }}-${{ runner.arch }}-sunclub-${{ hashFiles('mise.lock', 'uv.lock', 'hk.pkl') }}
    - name: Select Xcode
      if: inputs.xcode == 'true'
      shell: bash
      env:
        SUNCLUB_XCODE_VERSION: "27.1"
      run: |
        sudo xcode-select -s "/Applications/Xcode_${SUNCLUB_XCODE_VERSION}.app/Contents/Developer"
        xcodebuild -version
    - name: Prepare Tuist cache
      if: inputs.xcode == 'true'
      shell: bash
      run: mise --locked exec -- bash scripts/tooling/prepare_ci_workspace.sh
