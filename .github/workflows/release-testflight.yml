---
name: Release TestFlight

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  release:
    name: Archive and Export
    runs-on: macos-26
    environment: testflight
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
        timeout-minutes: 10
        with:
          xcode: "true"
      - name: Require full CI for release source
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise --locked exec -- uv run python -m scripts.tooling.ci_policy require-release

      - name: Materialize App Store Connect key
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          test -n "$ASC_KEY_ID"
          test -n "$ASC_KEY_P8"
          key_path="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_KEY_P8" > "$key_path"
          chmod 600 "$key_path"
          echo "ASC_KEY_FILE=$key_path" >> "$GITHUB_ENV"

      - name: Resolve release versions
        shell: bash
        run: |
          {
            mise --locked exec -- uv run python -m scripts.tooling.resolve_versions --format github-env
            echo "SUNCLUB_FLAVOR=prod"
            echo "SUNCLUB_APS_ENVIRONMENT=production"
            echo "SUNCLUB_TUIST_SHARE=0"
          } >> "$GITHUB_ENV"

      - name: Validate App Store metadata
        run: mise --locked exec -- just appstore-validate

      - name: Run release launch safety tests
        timeout-minutes: 45
        run: mise --locked exec -- just test-unit

      - name: Archive and export production app
        timeout-minutes: 90
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_FILE: ${{ env.ASC_KEY_FILE }}
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          archive_args=(--allow-draft-metadata --unsigned-archive)
          case "$RELEASE_EVENT_NAME:$RELEASE_REF_TYPE" in
            push:tag) archive_args+=(--upload-testflight) ;;
            workflow_dispatch:*) ;;
            *) printf 'Unsupported release event\n' >&2; exit 1 ;;
          esac
          bash scripts/appstore/archive-and-upload.sh "${archive_args[@]}"

      - name: Add Internal testers group
        if: github.event_name == 'push' && github.ref_type == 'tag'
        timeout-minutes: 60
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_FILE: ${{ env.ASC_KEY_FILE }}
        run: mise --locked exec -- uv run python -m scripts.appstore.testflight_groups --group Internal

      - name: Upload release artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ github.event_name == 'push' && format('sunclub-testflight-{0}', github.ref_name) || format('sunclub-export-{0}', github.run_id) }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            .build/Sunclub.xcarchive
            .build/export
            .build/release-diagnostics
