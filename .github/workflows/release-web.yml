---
name: Release Web

on:
  push:
    tags:
      - "web/v*.*.*"

concurrency:
  group: release-web-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Publish Web Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
        timeout-minutes: 10

      - name: Resolve web release version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#web/v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "WEB_VERSION=$version" >> "$GITHUB_ENV"

      - name: Build and package static site
        env:
          WEB_VERSION: ${{ env.WEB_VERSION }}
        run: mise --locked exec -- just web-package VERSION="$WEB_VERSION"

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: Sunclub Web ${{ env.WEB_VERSION }}
          files: |
            .build/releases/sunclub-web-${{ env.WEB_VERSION }}.tar.gz
            .build/releases/sunclub-web-${{ env.WEB_VERSION }}.tar.gz.sha256
          generate_release_notes: true
