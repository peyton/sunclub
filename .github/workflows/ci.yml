---
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect iOS Changes
    runs-on: ubuntu-26.04
    outputs:
      run_ios: ${{ steps.classify.outputs.run_ios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify changed paths
        id: classify
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 -m scripts.tooling.ci_policy changes

  lint:
    name: Lint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint 1.7.12 does not support $/ syntax
        timeout-minutes: 10
      - run: mise --locked exec -- just ci-lint

  test-python:
    name: Python Tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint 1.7.12 does not support $/ syntax
        timeout-minutes: 10
      - run: mise --locked exec -- just ci-python

  test-ios-unit:
    name: iOS Unit Tests
    runs-on: xcode-27
    needs: changes
    if: needs.changes.outputs.run_ios == 'true'
    permissions:
      contents: read
      id-token: write
    env:
      SUNCLUB_FLAVOR: prod
      SUNCLUB_APS_ENVIRONMENT: production
      TEST_APP_SCHEME: Sunclub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint 1.7.12 does not support $/ syntax
        timeout-minutes: 10
        with:
          xcode: "true"
      - name: Run unit tests
        timeout-minutes: 45
        run: mise --locked exec -- just test-unit
      - name: Upload failed Unit test result
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-unit-test-result
          path: .build/test-unit*
          include-hidden-files: true
          retention-days: 3

  test-ios-ui:
    name: iOS UI Tests
    runs-on: xcode-27
    needs: changes
    if: needs.changes.outputs.run_ios == 'true'
    permissions:
      contents: read
      id-token: write
    env:
      SUNCLUB_FLAVOR: prod
      SUNCLUB_APS_ENVIRONMENT: production
      TEST_APP_SCHEME: Sunclub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint 1.7.12 does not support $/ syntax
        timeout-minutes: 10
        with:
          xcode: "true"
      - name: Run UI smoke tests
        if: github.event_name == 'pull_request'
        timeout-minutes: 45
        run: mise --locked exec -- just test-ui-smoke
      - name: Run full UI tests
        if: github.event_name != 'pull_request'
        timeout-minutes: 45
        run: mise --locked exec -- just test-ui
      - name: Upload failed UI test result
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-ui-test-result
          path: .build/test-ui*
          include-hidden-files: true
          retention-days: 3

  build-ios:
    name: Build iOS (${{ matrix.name }})
    runs-on: xcode-27
    needs: changes
    if: needs.changes.outputs.run_ios == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Development
            flavor: dev
          - name: Production
            flavor: prod
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint 1.7.12 does not support $/ syntax
        timeout-minutes: 10
        with:
          xcode: "true"
      - name: Build device app and extensions
        timeout-minutes: 45
        env:
          BUILD_FLAVOR: ${{ matrix.flavor }}
        run: mise --locked exec -- just ci-build "$BUILD_FLAVOR"

  gate:
    name: CI
    runs-on: ubuntu-26.04
    needs: [changes, lint, test-python, test-ios-unit, test-ios-ui, build-ios]
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate required results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 -m scripts.tooling.ci_policy gate
