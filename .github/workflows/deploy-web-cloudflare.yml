---
name: Deploy Web to Cloudflare

on:
  push:
    branches: [master]
    paths:
      - "web/**"
  pull_request:
    branches: [master]
    paths:
      - "web/**"

concurrency:
  group: deploy-web-cloudflare-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Web Artifact
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint 1.7.12 does not support $/ syntax
        timeout-minutes: 10

      - name: Build and package static site
        run: mise --locked exec -- just web-package VERSION=${{ github.sha }}

      - name: Upload web rollback artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sunclub-web-${{ github.sha }}
          path: |
            .build/releases/sunclub-web-${{ github.sha }}.tar.gz
            .build/releases/sunclub-web-${{ github.sha }}.tar.gz.sha256
          retention-days: 90

  deploy:
    name: Deploy Web to Cloudflare Pages
    runs-on: ubuntu-26.04
    needs: build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    environment:
      name: cloudflare-production
      url: https://sunclub.peyton.app
    permissions:
      contents: read
    steps:
      - name: Download web rollback artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sunclub-web-${{ github.sha }}
          path: .build/releases

      - name: Verify and extract web artifact
        shell: bash
        run: |
          cd .build/releases
          shasum -a 256 -c "sunclub-web-${GITHUB_SHA}.tar.gz.sha256"
          cd "${GITHUB_WORKSPACE}"
          rm -rf .build/web
          mkdir -p .build/web
          tar -xzf ".build/releases/sunclub-web-${GITHUB_SHA}.tar.gz" -C .build/web

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          wranglerVersion: "4.151.1"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .build/web --project-name=sunclub --branch=master --commit-hash=${{ github.sha }}
