min_version = { soft = '2026.10.13' }

# CI and release workflows enforce lockfile installation with `mise --locked`.
# Keep `mise.toml` and `mise.lock` aligned whenever tool versions change.
[tools]
just = "1.59.0"
tuist = { version = "4.216.6", os = ["macos"] }
hk = "2.12.0"
actionlint = "1.7.12"
python = "3.15.0"
uv = "0.13.8"
node = "26.13.1"
"npm:prettier" = "3.10.1"
"npm:wrangler" = "4.161.0"
ruff = "0.17.5"
shellcheck = "0.11.0"
rumdl = "v0.3.4"
shfmt = "3.14.1"
zizmor = "1.32.0"
swiftlint = "0.65.1"
pkl = "0.33.0"

[settings]
experimental = true
lockfile = true
