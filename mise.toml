min_version = { soft = '2026.10.13' }

# CI and release workflows enforce lockfile installation with `mise --locked`.
# Keep `mise.toml` and `mise.lock` aligned whenever tool versions change.
[tools]
just = "1.59.0"
tuist = { version = "4.213.0", os = ["macos"] }
hk = "2.8.1"
actionlint = "1.7.12"
python = "3.15.0"
uv = "0.13.5"
node = "26.12.1"
"npm:prettier" = "3.9.10"
"npm:wrangler" = "4.152.0"
ruff = "0.17.3"
shellcheck = "0.11.0"
rumdl = "v0.3.0"
shfmt = "3.14.1"
zizmor = "1.31.1"
swiftlint = "0.65.1"
pkl = "0.32.2"

[settings]
experimental = true
lockfile = true
